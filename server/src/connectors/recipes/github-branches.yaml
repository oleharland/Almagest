# Recipe: github-branches — the branches of one repository, as ONE live
# document. A live recipe describes current state: live lookup answers from it
# and never keeps it (`live: true`), and `sync` refuses it. Give the connector
# `lookup: true` and the same `select.repo` as the `github` connector.
#
# verified: no — written against the README of github/github-mcp-server (tool
# `list_branches`: owner, repo, perPage; toolset `repos`). Not run against the
# live server. The README does not document the result fields. The mapping
# assumes GitHub's REST shape, which the server passes through: an array of
# { name, commit: { sha }, protected }. The tool does not say which branch is the
# default, so the document does not either. Only the first page (100 branches)
# is read.
#
# select:
#   repo:  owner/name   (required)
#   limit: 100          branches listed (the server allows at most 100)
#
# The question's words are not sent: the search and the list are the same call.
name: github-branches
description: The branches of a GitHub repository with their head commits, as one live document.
live: true
about: [branches, branch, heads, github, repository, repo]
list:
  tool: list_branches
  args:
    owner: "{{select.repo | before:/}}"
    repo: "{{select.repo | after:/}}"
    perPage: "{{select.limit | default:100}}"
  items: "$"
  ref: "{{select.repo}}:branches"
  title: "Branches in {{select.repo}}"
search:
  tool: list_branches
  args:
    owner: "{{select.repo | before:/}}"
    repo: "{{select.repo | after:/}}"
    perPage: "{{select.limit | default:100}}"
  items: "$"
  ref: "{{select.repo}}:branches"
  title: "Branches in {{select.repo}}"
fetch:
  render: lines
  render_options:
    rows: "branches[*] | items[*] | [*]"
    section: Branches
    line: "{{raw.name}} (head {{raw.commit.sha | short:7}})"
    max: 100
