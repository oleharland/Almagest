# brain/manifest.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Machine-readable record of every source ever ingested into this brain.
#
# Why it exists: incremental re-ingest. Before processing a source the agent
# looks it up here and gets one of three answers — new, unchanged, or changed —
# and only does real work for the first and the third.
#
# This file SUPPLEMENTS `brain/index.md`. It does not replace it.
#   index.md       — the human-readable catalog. Read it to see what is in here.
#   manifest.yaml  — the machine record. The agent reads it to decide what to do.
# Neither is redundant. Deleting either one breaks something. Keep both.
#
# Change detection:
#   local   — sha256 of the file's bytes  (`shasum -a 256` / `sha256sum`)
#   remote  — the commit SHA the file was read at
# A filename alone is never sufficient. A file that was ingested, edited, and
# dropped back into `raw/` is a CHANGED source, not a duplicate. That is the bug
# this file exists to fix.
#
# Binary sources are hashed TWICE, because two different files matter:
#   sha256           — the gitignored original in `raw/processed/`. Change
#                      detection compares this one.
#   extracted_sha256 — the COMMITTED text sidecar in `raw/extracted/`. This is
#                      the digest wiki pages carry in `sources[].sha256`, because
#                      the sidecar is the file their citations point into.
# `CITE-005` compares a page's `sources[].sha256` against the value here. When
# they disagree the page is citing a version this manifest has moved past, and
# the audit says so as a fact — "this page cites v1; the manifest is at v2 — 4
# citations unverified" — not as a guess from a `last_verified` date.
#
# Agent-maintained. Written to an `ingest/<source-slug>-<sha7>` branch in the
# same commit as the pages it describes, never in a commit of its own and never
# ahead of them. Hand-edit only to repair drift — see `docs/manifest.md`.
#
# There is no separate revision history: this file is committed to git, so
# `git log -p brain/manifest.yaml` is the history.
# ──────────────────────────────────────────────────────────────────────────────


# ── Schema version ────────────────────────────────────────────────────────────
# Bumped only when the entry shape changes in a way that needs a migration.

version: 1


# ── Sources ───────────────────────────────────────────────────────────────────
# One entry per ingested source. Order is not significant — keep entries sorted
# by `id` so git diffs stay readable.
#
# Fields common to both kinds:
#
#   id              — stable identifier, assigned at first ingest, NEVER changed
#                     afterwards. Convention: the slugified filename (local) or
#                     `provider:repo:path` (remote). It survives renames — that
#                     is the whole reason `id` is separate from `path`.
#   kind            — local | remote
#   path            — local:  path relative to repo root, current location of
#                             the ORIGINAL (gitignored, if binary)
#                     remote: path within the repo
#   bytes           — size in bytes at last ingest
#   first_ingested  — ISO-8601 date of the first successful ingest
#   last_ingested   — ISO-8601 date of the most recent successful ingest
#   pages           — wiki slugs this source created or touched. Bare slugs:
#                     no `.md`, no `[[brackets]]`. This list is what makes a
#                     changed source re-ingest as a targeted diff instead of a
#                     blind re-extraction.
#   status          — ingested | partial | skipped | missing | superseded
#                       ingested   — fully processed; manifest matches reality
#                       partial    — the user approved some proposed pages and
#                                    rejected others; `notes` says which
#                       skipped    — deliberately not ingested (outside
#                                    canonical scope). Recorded so it is not
#                                    re-proposed on every run
#                       missing    — the ORIGINAL is gone from
#                                    `raw/processed/`. Usually a gitignored
#                                    binary on a fresh clone. Pages stay, the
#                                    entry stays, nothing is re-ingested — and
#                                    the sidecar is committed, so citations
#                                    into it still verify
#                       superseded — replaced by another entry, named in
#                                    `superseded_by`
#   superseded_by   — id of the replacing entry. Only with `status: superseded`.
#   notes           — optional free text: why it was skipped, what changed on
#                     the last re-ingest, that the entry was backfilled.
#
# local only:
#
#   sha256          — hex digest of the ORIGINAL's bytes at last ingest
#                     (64 chars). This is what change detection compares.
#   extracted       — binary sources only: path to the committed text sidecar
#                     under `brain/raw/extracted/`, named
#                     `<original-filename>.txt`. `none` when the source has no
#                     extractable text at all (unOCR'd scan, silent video) —
#                     say why in `notes`. Text sources omit the field: the
#                     original is committed and is cited directly.
#                     The sidecar, not the original, is what pages cite.
#   extracted_sha256 — hex digest of the sidecar (64 chars). Required whenever
#                     `extracted` names a file. This is the value that must
#                     equal `sources[].sha256` on every page citing this source.
#   previous_paths  — earlier locations of this same content: renames, filename
#                     sanitization, moves. Optional.
#
# remote only:
#
#   provider        — github | gitlab
#   repo            — `owner/repo` on GitHub, `namespace/project` on GitLab
#   branch          — branch the file was read from
#   commit          — commit SHA the file was read at
#   label           — the `label` from `brain.config.yaml` → `sources.remote`
#
#
# ── Example entries ───────────────────────────────────────────────────────────
# Commented out on purpose. This is the shape, not real data. Delete these
# comments once you have real entries, or leave them as a reference.
#
# sources:
#
#   # A local binary, ingested once and later re-ingested after being edited.
#   # `sha256` is the v2 digest; the v1 digest lives in git history.
#   # The original is gitignored; the sidecar under `raw/extracted/` is not, and
#   # it is what `system-architecture` and `data-pipeline` cite.
#   - id: system-overview-pdf
#     kind: local
#     path: brain/raw/processed/system-overview.pdf
#     sha256: b72fbfb7f607dc872d4ab091ca308a4f9c6d111e17e63ba81365c242d14e6c83
#     extracted: brain/raw/extracted/system-overview.pdf.txt
#     extracted_sha256: 4c1d9a2e0f83b7615ad4c02e9f7188bb35c6d4a1e0927fb3c85d61ae4f20c7d9
