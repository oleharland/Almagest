<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citation chain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2B2C31;
      --color-ink:     #F4F4F5;
      --color-muted:   #BCBCBE;
      --color-accent:  #7B9EFF;
      --font-sans:     'Geist Variable', 'Geist', system-ui, sans-serif;
      --font-mono:     'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Almagest</p>
    <h1>Citation chain</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="citation-chain-dark-title citation-chain-dark-desc">
        <title id="citation-chain-dark-title">Citation chain</title>
        <desc id="citation-chain-dark-desc">A claim on a wiki page traced back to its source: tools/audit.mjs checks that the citation parses, that its id is in the page's sources, that the sidecar path exists, and that the source is in the manifest with a matching sha256; whether page 12 actually says what the claim says is checked by a person in the diff review.</desc>
        <defs>
        <marker id="citation-chain-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#A2A3A6"/></marker>
        <marker id="citation-chain-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7B9EFF"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#2B2C31"/>
        <text x="468" y="52" fill="#BCBCBE" font-size="14" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="middle" font-style="italic">Does page 12 actually say that? The audit can&#8217;t tell. You check it in the diff.</text>
        <path d="M 188,120 V 92 Q 188,84 196,84 H 740 Q 748,84 748,92 V 120" fill="none" stroke="#7B9EFF" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#citation-chain-dark-arrow-accent)"/>
        <rect x="438" y="64" width="60" height="12" rx="2" fill="#2B2C31"/>
        <text x="468" y="73" fill="#F4F4F5" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YOU VERIFY</text>
        <path d="M 280,176 H 360" stroke="#A2A3A6" stroke-width="1.2" fill="none" marker-end="url(#citation-chain-dark-arrow)"/>
        <rect x="296" y="156" width="48" height="12" rx="2" fill="#2B2C31"/>
        <text x="320" y="165" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CITE-002</text>
        <path d="M 600,176 H 680" stroke="#A2A3A6" stroke-width="1.2" fill="none" marker-end="url(#citation-chain-dark-arrow)"/>
        <rect x="616" y="156" width="48" height="12" rx="2" fill="#2B2C31"/>
        <text x="640" y="165" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PROV-001</text>
        <path d="M 480,232 V 296" stroke="#A2A3A6" stroke-width="1.2" fill="none" marker-end="url(#citation-chain-dark-arrow)"/>
        <rect x="488" y="250" width="52" height="26" rx="2" fill="#2B2C31"/>
        <text x="514" y="260" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PROV-003</text>
        <text x="514" y="272" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CITE-005</text>
        <path d="M 600,344 H 680" stroke="#A2A3A6" stroke-width="1" stroke-dasharray="5,4" fill="none" marker-end="url(#citation-chain-dark-arrow)"/>
        <rect x="608" y="324" width="64" height="12" rx="2" fill="#2B2C31"/>
        <text x="640" y="333" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FINGERPRINT</text>
        <path d="M 800,296 V 232" stroke="#A2A3A6" stroke-width="1" stroke-dasharray="5,4" fill="none" marker-end="url(#citation-chain-dark-arrow)"/>
        <rect x="808" y="258" width="56" height="12" rx="2" fill="#2B2C31"/>
        <text x="836" y="267" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EXTRACTED</text>
        <rect x="40" y="120" width="240" height="112" rx="6" fill="#2B2C31"/>
        <rect x="40" y="120" width="240" height="112" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="56" y="144" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Claim on a wiki page</text>
        <text x="56" y="160" fill="#A2A3A6" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">wiki/retention-policy.md</text>
        <text x="56" y="182" fill="#F4F4F5" font-size="10" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">&#8220;Logs are kept 90 days&#8221;</text>
        <text x="56" y="196" fill="#BCBCBE" font-size="10" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">[source: q3-review, p.12]</text>
        <line x1="56" y1="208" x2="264" y2="208" stroke="rgba(244,244,245,0.13)" stroke-width="0.8"/>
        <text x="56" y="222" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">CITE-001 &#183; CITE-003</text>
        <rect x="360" y="120" width="240" height="112" rx="6" fill="#2B2C31"/>
        <rect x="360" y="120" width="240" height="112" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="376" y="144" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Source entry</text>
        <text x="376" y="160" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">in the page&#8217;s frontmatter</text>
        <text x="376" y="182" fill="#BCBCBE" font-size="10" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">id: q3-review</text>
        <text x="376" y="196" fill="#BCBCBE" font-size="10" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">path: &#8230;/q3-review.pdf.txt</text>
        <text x="376" y="210" fill="#BCBCBE" font-size="10" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">sha256: 4c1d&#8230;</text>
        <rect x="680" y="120" width="240" height="112" rx="6" fill="#2B2C31"/>
        <rect x="680" y="120" width="240" height="112" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="696" y="144" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Text sidecar</text>
        <text x="696" y="160" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">committed, page-marked text</text>
        <text x="696" y="182" fill="#BCBCBE" font-size="10" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">brain/raw/extracted/</text>
        <text x="696" y="196" fill="#BCBCBE" font-size="10" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">q3-review.pdf.txt</text>
        <rect x="696" y="204" width="104" height="16" rx="2" fill="#7B9EFF"/>
        <text x="748" y="216" fill="#1A1C21" font-size="10" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle">=== page 12 ===</text>
        <rect x="360" y="296" width="240" height="96" rx="6" fill="#2B2C31"/>
        <rect x="360" y="296" width="240" height="96" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="376" y="320" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Manifest entry</text>
        <text x="376" y="336" fill="#A2A3A6" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">brain/manifest.yaml</text>
        <text x="376" y="358" fill="#BCBCBE" font-size="10" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">extracted_sha256: 4c1d&#8230;</text>
        <text x="376" y="372" fill="#BCBCBE" font-size="10" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">sha256: b72f&#8230;</text>
        <rect x="680" y="296" width="240" height="96" rx="6" fill="#2B2C31"/>
        <rect x="680" y="296" width="240" height="96" rx="6" fill="#3E4044" stroke="#A2A3A6" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="696" y="320" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Original PDF</text>
        <text x="696" y="336" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">gitignored, never committed</text>
        <text x="696" y="358" fill="#BCBCBE" font-size="10" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">brain/raw/processed/</text>
        <text x="696" y="372" fill="#BCBCBE" font-size="10" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">q3-review.pdf</text>
        <line x1="40" y1="424" x2="920" y2="424" stroke="rgba(244,244,245,0.13)" stroke-width="0.8"/>
        <text x="40" y="452" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <path d="M 120,449 H 148" stroke="#A2A3A6" stroke-width="1.2" fill="none" marker-end="url(#citation-chain-dark-arrow)"/>
        <text x="160" y="452" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">checked by <tspan font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace">tools/audit.mjs</tspan></text>
        <path d="M 344,449 H 372" stroke="#7B9EFF" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#citation-chain-dark-arrow-accent)"/>
        <text x="384" y="452" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">checked by you, in the diff review</text>
        <path d="M 584,449 H 612" stroke="#A2A3A6" stroke-width="1" stroke-dasharray="5,4" fill="none" marker-end="url(#citation-chain-dark-arrow)"/>
        <text x="624" y="452" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">recorded at ingest, not audited</text>
        </svg>
    </div>
  </div>
</body>
</html>
