<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What the brain does with what lookup finds</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F4F4F5;
      --color-ink:     #1A1C21;
      --color-muted:   #3E4044;
      --color-accent:  #3B5DEF;
      --font-sans:     'Geist Variable', 'Geist', system-ui, sans-serif;
      --font-mono:     'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.5rem; }

    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Almagest</p>
    <h1>What the brain does with what lookup finds</h1>
    <p class="sub">canonical pages stay the guardrail (design, not built yet)</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lookup-guardrails-title lookup-guardrails-desc">
        <title id="lookup-guardrails-title">What the brain does with what lookup finds</title>
        <desc id="lookup-guardrails-desc">An unreviewed passage found by lookup is checked against canonical pages before the chat answers, and any disagreement is reported with both sides attributed. The fetched document is later ingested on a branch: new facts become an evidence page, a contradiction of canonical is logged and never written, a contradiction of a reviewed page is quoted, and a person decides.</desc>
        <defs>
        <marker id="lookup-guardrails-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6F7074"/></marker>
        <marker id="lookup-guardrails-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3B5DEF"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#F4F4F5"/>
        <rect x="44" y="40" width="956" height="128" rx="6" fill="none" stroke="#D4D4D6" stroke-width="1" stroke-dasharray="2,3"/>
        <text x="980" y="60" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">WHEN ANSWERING</text>
        <rect x="44" y="200" width="956" height="320" rx="6" fill="none" stroke="#D4D4D6" stroke-width="1" stroke-dasharray="2,3"/>
        <text x="980" y="220" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">WHEN INGESTING</text>
        <path d="M 272,108 H 336" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#lookup-guardrails-arrow)"/>
        <path d="M 592,108 H 656" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#lookup-guardrails-arrow)"/>
        <path d="M 144,144 V 320" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#lookup-guardrails-arrow)"/>
        <rect x="120" y="176" width="48" height="12" rx="2" fill="#F4F4F5"/>
        <text x="144" y="185" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">QUEUED</text>
        <path d="M 224,356 H 264" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#lookup-guardrails-arrow)"/>
        <path d="M 336,304 V 268 Q 336,260 344,260 H 536" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#lookup-guardrails-arrow)"/>
        <rect x="422" y="254" width="36" height="12" rx="2" fill="#F4F4F5"/>
        <text x="440" y="263" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ADDS</text>
        <path d="M 408,356 H 536" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#lookup-guardrails-arrow)"/>
        <rect x="430" y="350" width="84" height="12" rx="2" fill="#F4F4F5"/>
        <text x="472" y="359" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VS CANONICAL</text>
        <path d="M 336,408 V 444 Q 336,452 344,452 H 536" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#lookup-guardrails-arrow)"/>
        <rect x="410" y="446" width="60" height="12" rx="2" fill="#F4F4F5"/>
        <text x="440" y="455" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VS A PAGE</text>
        <path d="M 780,260 H 788 Q 796,260 796,268 V 330 Q 796,338 804,338 H 816" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#lookup-guardrails-arrow)"/>
        <path d="M 780,356 H 816" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#lookup-guardrails-arrow)"/>
        <path d="M 780,452 H 788 Q 796,452 796,444 V 382 Q 796,374 804,374 H 816" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#lookup-guardrails-arrow)"/>
        <rect x="64" y="72" width="208" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="64" y="72" width="208" height="72" rx="6" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="80" y="96" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">UNREVIEWED PASSAGE</text>
        <text x="80" y="114" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">found by lookup</text>
        <rect x="336" y="72" width="256" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="336" y="72" width="256" height="72" rx="6" fill="#3B5DEF" stroke="#3B5DEF" stroke-width="1"/>
        <text x="352" y="96" fill="#FFFFFF" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">CANONICAL CHECK</text>
        <text x="352" y="114" fill="#FFFFFF" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">matching canonical pages go first</text>
        <text x="352" y="130" fill="#FFFFFF" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">their statement is the brain's answer</text>
        <rect x="656" y="72" width="256" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="656" y="72" width="256" height="72" rx="6" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="672" y="96" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">ANSWER IN THE CHAT</text>
        <text x="672" y="114" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">a disagreement is reported</text>
        <text x="672" y="130" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">both sides attributed</text>
        <rect x="64" y="320" width="160" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="64" y="320" width="160" height="72" rx="6" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="80" y="344" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">INGEST JOB</text>
        <text x="80" y="362" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">the fetched document</text>
        <text x="80" y="378" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">on an ingest/ branch</text>
        <path d="M 336,304 L 408,356 L 336,408 L 264,356 Z" fill="#F4F4F5"/>
        <path d="M 336,304 L 408,356 L 336,408 L 264,356 Z" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="336" y="353" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">What does</text>
        <text x="336" y="369" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">it say?</text>
        <rect x="536" y="224" width="244" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="536" y="224" width="244" height="72" rx="6" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="552" y="248" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">NEW FACTS</text>
        <text x="552" y="266" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">an evidence page</text>
        <text x="552" y="282" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">in the proposal</text>
        <rect x="536" y="320" width="244" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="536" y="320" width="244" height="72" rx="6" fill="#3B5DEF" stroke="#3B5DEF" stroke-width="1"/>
        <text x="552" y="344" fill="#FFFFFF" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">CONTRADICTS CANONICAL</text>
        <text x="552" y="362" fill="#FFFFFF" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">never written to the wiki</text>
        <text x="552" y="378" fill="#FFFFFF" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">challenge logged · CANON-001</text>
        <rect x="536" y="416" width="244" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="536" y="416" width="244" height="72" rx="6" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="552" y="440" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">CONTRADICTS A REVIEWED PAGE</text>
        <text x="552" y="458" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">both claims quoted</text>
        <text x="552" y="474" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">nothing is overwritten</text>
        <rect x="816" y="320" width="168" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="816" y="320" width="168" height="72" rx="6" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="832" y="344" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">YOU DECIDE</text>
        <text x="832" y="362" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">approve, log the challenge</text>
        <text x="832" y="378" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">or dismiss</text>
        <line x1="40" y1="548" x2="1000" y2="548" stroke="rgba(26,28,33,0.10)" stroke-width="0.8"/>
        <text x="40" y="576" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <path d="M 120,573 H 148" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#lookup-guardrails-arrow)"/>
        <text x="160" y="576" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">next step</text>
        <rect x="268" y="567" width="28" height="12" rx="3" fill="#3B5DEF"/>
        <text x="308" y="576" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">where a canonical page acts as the guardrail</text>
        </svg>
    </div>
  </div>
</body>
</html>
