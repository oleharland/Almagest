<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One ask, cheapest source first</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2B2C31;
      --color-ink:     #F4F4F5;
      --color-muted:   #BCBCBE;
      --color-accent:  #7B9EFF;
      --font-sans:     'Geist Variable', 'Geist', system-ui, sans-serif;
      --font-mono:     'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.5rem; }

    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Almagest</p>
    <h1>One ask, cheapest source first</h1>
    <p class="sub">live lookup (design, not built yet)</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="live-lookup-dark-title live-lookup-dark-desc">
        <title id="live-lookup-dark-title">One ask, cheapest source first</title>
        <desc id="live-lookup-dark-desc">A chat makes one call to the Almagest server. The server answers from the reviewed wiki when it can; otherwise it looks in ingested sources, then snapshots waiting for review, then connected MCPs, packs matching passages into a token budget, and queues what it fetched for review so the next ask is answered by the brain.</desc>
        <defs>
        <marker id="live-lookup-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#A2A3A6"/></marker>
        <marker id="live-lookup-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7B9EFF"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#2B2C31"/>
        <rect x="268" y="200" width="732" height="136" rx="6" fill="none" stroke="rgba(244,244,245,0.32)" stroke-width="1" stroke-dasharray="2,3"/>
        <text x="980" y="220" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">LOOKUP, CHEAPEST FIRST</text>
        <path d="M 240,108 H 280" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#live-lookup-dark-arrow)"/>
        <path d="M 480,108 H 576" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#live-lookup-dark-arrow)"/>
        <rect x="502" y="102" width="52" height="12" rx="2" fill="#2B2C31"/>
        <text x="528" y="111" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COVERED</text>
        <path d="M 380,144 V 240" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#live-lookup-dark-arrow)"/>
        <rect x="342" y="166" width="76" height="12" rx="2" fill="#2B2C31"/>
        <text x="380" y="175" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NOT COVERED</text>
        <path d="M 474,276 H 540" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#live-lookup-dark-arrow)"/>
        <rect x="483" y="270" width="48" height="12" rx="2" fill="#2B2C31"/>
        <text x="507" y="279" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NOTHING</text>
        <path d="M 728,276 H 794" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#live-lookup-dark-arrow)"/>
        <rect x="737" y="270" width="48" height="12" rx="2" fill="#2B2C31"/>
        <text x="761" y="279" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NOTHING</text>
        <path d="M 680,200 V 144" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#live-lookup-dark-arrow)"/>
        <rect x="652" y="166" width="56" height="12" rx="2" fill="#2B2C31"/>
        <text x="680" y="175" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FIRST HIT</text>
        <path d="M 784,108 H 824" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#live-lookup-dark-arrow)"/>
        <path d="M 888,312 V 400" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#live-lookup-dark-arrow)"/>
        <rect x="860" y="350" width="56" height="12" rx="2" fill="#2B2C31"/>
        <text x="888" y="359" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">QUEUE IT</text>
        <path d="M 736,436 H 688" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#live-lookup-dark-arrow)"/>
        <path d="M 480,436 H 172 Q 164,436 164,428 V 184 Q 164,176 172,176 H 292 Q 300,176 300,168 V 144" fill="none" stroke="#A2A3A6" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#live-lookup-dark-arrow)"/>
        <rect x="294" y="430" width="56" height="12" rx="2" fill="#2B2C31"/>
        <text x="322" y="439" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEXT ASK</text>
        <rect x="64" y="72" width="176" height="72" rx="6" fill="#2B2C31"/>
        <rect x="64" y="72" width="176" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="80" y="96" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">CHAT</text>
        <text x="80" y="114" fill="#BCBCBE" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">one call: ask(question)</text>
        <rect x="280" y="72" width="200" height="72" rx="6" fill="#2B2C31"/>
        <rect x="280" y="72" width="200" height="72" rx="6" fill="#7B9EFF" stroke="#7B9EFF" stroke-width="1"/>
        <text x="296" y="96" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">THE BRAIN</text>
        <text x="296" y="114" fill="#1A1C21" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">reviewed pages on main</text>
        <rect x="576" y="72" width="208" height="72" rx="6" fill="#2B2C31"/>
        <rect x="576" y="72" width="208" height="72" rx="6" fill="#7B9EFF" stroke="#7B9EFF" stroke-width="1"/>
        <text x="592" y="96" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">PACK TO BUDGET</text>
        <text x="592" y="114" fill="#1A1C21" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">matching passages only</text>
        <text x="592" y="130" fill="#1A1C21" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">2,500 tokens by default</text>
        <rect x="824" y="72" width="176" height="72" rx="6" fill="#2B2C31"/>
        <rect x="824" y="72" width="176" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="840" y="96" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">ANSWER IN THE CHAT</text>
        <text x="840" y="114" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">labelled reviewed or unreviewed</text>
        <rect x="286" y="240" width="188" height="72" rx="6" fill="#2B2C31"/>
        <rect x="286" y="240" width="188" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="302" y="264" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">INGESTED SOURCES</text>
        <text x="302" y="282" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">source text already committed</text>
        <text x="302" y="298" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">no network call</text>
        <rect x="540" y="240" width="188" height="72" rx="6" fill="#2B2C31"/>
        <rect x="540" y="240" width="188" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="556" y="264" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">WAITING FOR REVIEW</text>
        <text x="556" y="282" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">snapshots already fetched</text>
        <text x="556" y="298" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">no network call</text>
        <rect x="794" y="240" width="188" height="72" rx="6" fill="#2B2C31"/>
        <rect x="794" y="240" width="188" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="810" y="264" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">CONNECTED MCPS</text>
        <text x="810" y="282" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">the server searches and fetches</text>
        <text x="810" y="298" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">at most 3 documents</text>
        <rect x="480" y="400" width="208" height="72" rx="6" fill="#2B2C31"/>
        <rect x="480" y="400" width="208" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="496" y="424" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">REVIEW AND MERGE</text>
        <text x="496" y="442" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">a person approves, main moves</text>
        <rect x="736" y="400" width="200" height="72" rx="6" fill="#2B2C31"/>
        <rect x="736" y="400" width="200" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="752" y="424" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">INGEST QUEUE</text>
        <text x="752" y="442" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">what was fetched is queued</text>
        <line x1="40" y1="500" x2="1000" y2="500" stroke="rgba(244,244,245,0.13)" stroke-width="0.8"/>
        <text x="40" y="528" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <path d="M 120,525 H 148" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#live-lookup-dark-arrow)"/>
        <text x="160" y="528" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">next step</text>
        <path d="M 248,525 H 276" fill="none" stroke="#A2A3A6" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#live-lookup-dark-arrow)"/>
        <text x="288" y="528" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">the next ask is answered by the brain</text>
        <rect x="560" y="519" width="28" height="12" rx="3" fill="#7B9EFF"/>
        <text x="600" y="528" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">the reviewed wiki, and the packed answer</text>
        </svg>
    </div>
  </div>
</body>
</html>
