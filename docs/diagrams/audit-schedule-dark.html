<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What starts an audit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2B2C31;
      --color-ink:     #F4F4F5;
      --color-muted:   #BCBCBE;
      --color-accent:  #7B9EFF;
      --font-sans:     'Geist Variable', 'Geist', system-ui, sans-serif;
      --font-mono:     'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.5rem; }

    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Almagest</p>
    <h1>What starts an audit</h1>
    <p class="sub">and how a scheduled re-check reaches a reviewer</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="audit-schedule-dark-title audit-schedule-dark-desc">
        <title id="audit-schedule-dark-title">What starts an audit</title>
        <desc id="audit-schedule-dark-desc">Connector syncs and the demand recompute run on a timer and queue agent jobs; every commit or push also triggers the audit. A job that passes the audit becomes a proposal, a notification reaches a person who reviews it, and approval leads to a re-audit and merge, which triggers a recompute.</desc>
        <defs>
        <marker id="audit-schedule-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#A2A3A6"/></marker>
        <marker id="audit-schedule-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7B9EFF"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#2B2C31"/>
        <rect x="44" y="40" width="272" height="244" rx="6" fill="none" stroke="rgba(244,244,245,0.32)" stroke-width="1" stroke-dasharray="2,3"/>
        <text x="64" y="60" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ON A TIMER</text>
        <rect x="44" y="300" width="272" height="124" rx="6" fill="none" stroke="rgba(244,244,245,0.32)" stroke-width="1" stroke-dasharray="2,3"/>
        <text x="64" y="320" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ON EVERY CHANGE</text>
        <rect x="388" y="440" width="272" height="124" rx="6" fill="#3E4044" fill-opacity="0.5" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="408" y="460" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">DONE BY A PERSON</text>
        <path d="M 296,108 H 408" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#audit-schedule-dark-arrow)"/>
        <rect x="318" y="90" width="68" height="12" rx="2" fill="#2B2C31"/>
        <text x="352" y="99" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INGEST JOB</text>
        <path d="M 296,212 H 464 Q 472,212 472,204 V 144" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#audit-schedule-dark-arrow)"/>
        <rect x="338" y="194" width="84" height="12" rx="2" fill="#2B2C31"/>
        <text x="380" y="203" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REVERIFY JOB</text>
        <path d="M 296,368 H 408" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#audit-schedule-dark-arrow)"/>
        <path d="M 576,144 V 332" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#audit-schedule-dark-arrow)"/>
        <path d="M 640,368 H 752" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#audit-schedule-dark-arrow)"/>
        <rect x="674" y="350" width="44" height="12" rx="2" fill="#2B2C31"/>
        <text x="696" y="359" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PASSES</text>
        <path d="M 868,404 V 468" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#audit-schedule-dark-arrow)"/>
        <path d="M 752,504 H 640" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#audit-schedule-dark-arrow)"/>
        <path d="M 408,504 H 296" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#audit-schedule-dark-arrow)"/>
        <rect x="324" y="486" width="56" height="12" rx="2" fill="#2B2C31"/>
        <text x="352" y="495" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>
        <path d="M 64,504 H 36 Q 28,504 28,496 V 220 Q 28,212 36,212 H 64" fill="none" stroke="#A2A3A6" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#audit-schedule-dark-arrow)"/>
        <rect x="38" y="434" width="64" height="12" rx="2" fill="#2B2C31"/>
        <text x="40" y="443" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">ON MERGE</text>
        <rect x="64" y="72" width="232" height="72" rx="6" fill="#2B2C31"/>
        <rect x="64" y="72" width="232" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="80" y="96" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">CONNECTOR SYNC</text>
        <text x="80" y="114" fill="#BCBCBE" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">cron per connector, e.g. @weekly</text>
        <text x="80" y="130" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">changed items only</text>
        <rect x="64" y="164" width="232" height="96" rx="6" fill="#2B2C31"/>
        <rect x="64" y="164" width="232" height="96" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="80" y="188" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">DEMAND RECOMPUTE</text>
        <text x="80" y="206" fill="#BCBCBE" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">every 5 minutes</text>
        <text x="80" y="222" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">hot pages unverified for 30+ days</text>
        <rect x="80" y="232" width="124" height="16" rx="2" fill="#2B2C31" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="88" y="243" fill="#BCBCBE" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">opt-in: auto_reverify</text>
        <rect x="64" y="332" width="232" height="72" rx="6" fill="#2B2C31"/>
        <rect x="64" y="332" width="232" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="80" y="356" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">COMMIT OR PUSH</text>
        <text x="80" y="374" fill="#BCBCBE" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">pre-commit hook · CI</text>
        <rect x="408" y="72" width="232" height="72" rx="6" fill="#2B2C31"/>
        <rect x="408" y="72" width="232" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="424" y="96" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">AGENT JOB</text>
        <text x="424" y="114" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">re-ingest or re-verify</text>
        <text x="424" y="130" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">on an ingest/ branch</text>
        <rect x="408" y="332" width="232" height="72" rx="6" fill="#2B2C31"/>
        <rect x="408" y="332" width="232" height="72" rx="6" fill="#7B9EFF" stroke="#7B9EFF" stroke-width="1"/>
        <text x="424" y="356" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">AUDIT</text>
        <text x="424" y="374" fill="#1A1C21" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">tools/audit.mjs</text>
        <text x="424" y="390" fill="#1A1C21" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">an error: nothing is committed</text>
        <rect x="752" y="332" width="232" height="72" rx="6" fill="#2B2C31"/>
        <rect x="752" y="332" width="232" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="768" y="356" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">PROPOSAL</text>
        <text x="768" y="374" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">each changed fact beside its source</text>
        <rect x="752" y="468" width="232" height="72" rx="6" fill="#2B2C31"/>
        <rect x="752" y="468" width="232" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="768" y="492" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">NOTIFY</text>
        <text x="768" y="510" fill="#BCBCBE" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">Slack · email · GitHub PR</text>
        <rect x="408" y="468" width="232" height="72" rx="6" fill="#2B2C31"/>
        <rect x="408" y="468" width="232" height="72" rx="6" fill="#7B9EFF" stroke="#7B9EFF" stroke-width="1"/>
        <text x="424" y="492" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">YOU REVIEW</text>
        <text x="424" y="510" fill="#1A1C21" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">approve the version shown</text>
        <rect x="64" y="468" width="232" height="72" rx="6" fill="#2B2C31"/>
        <rect x="64" y="468" width="232" height="72" rx="6" fill="#3E4044" stroke="rgba(244,244,245,0.32)" stroke-width="1"/>
        <text x="80" y="492" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">RE-AUDIT AND MERGE</text>
        <text x="80" y="510" fill="#BCBCBE" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">main moves</text>
        <line x1="40" y1="584" x2="1000" y2="584" stroke="rgba(244,244,245,0.13)" stroke-width="0.8"/>
        <text x="40" y="612" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <path d="M 120,609 H 148" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#audit-schedule-dark-arrow)"/>
        <text x="160" y="612" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">next step</text>
        <path d="M 248,609 H 276" fill="none" stroke="#A2A3A6" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#audit-schedule-dark-arrow)"/>
        <text x="288" y="612" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">a merge triggers a recompute</text>
        <rect x="496" y="603" width="28" height="12" rx="3" fill="#3E4044" fill-opacity="0.5" stroke="rgba(244,244,245,0.32)"/>
        <text x="536" y="612" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">the only step done by a person; the rest is the service</text>
        </svg>
    </div>
  </div>
</body>
</html>
