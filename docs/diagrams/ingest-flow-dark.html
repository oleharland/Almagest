<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almagest ingest flow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2B2C31;
      --color-ink:     #F4F4F5;
      --color-muted:   #A2A3A6;
      --color-accent:  #7B9EFF;
      --font-sans:     'Geist Variable', 'Geist', system-ui, sans-serif;
      --font-mono:     'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Almagest</p>
    <h1>How a source becomes wiki pages</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ingest-flow-dark-title ingest-flow-dark-desc">
        <title id="ingest-flow-dark-title">How a source becomes wiki pages</title>
        <desc id="ingest-flow-dark-desc">Swimlane of Almagest ingest: you drop a source, the AI agent fingerprints it, extracts a text sidecar and drafts pages on an ingest branch, stopping to ask you on blocking cases; code-based audit gates the commit, and only your review and merge moves pages onto main.</desc>

        </defs>

        <rect width="100%" height="100%" fill="#2B2C31"/>

        <text x="52" y="86" fill="#A2A3A6" font-size="8" font-weight="500" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">YOU</text>
        <text x="52" y="100" fill="#BCBCBE" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">a person</text>
        <text x="52" y="190" fill="#A2A3A6" font-size="8" font-weight="500" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">AGENT</text>
        <text x="52" y="204" fill="#BCBCBE" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">AI coding agent</text>
        <text x="52" y="322" fill="#A2A3A6" font-size="8" font-weight="500" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">AUDIT</text>

        <text x="228" y="108" fill="#BCBCBE" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="middle">or a repo via MCP</text>
        <rect x="400" y="56" width="240" height="64" rx="6" fill="#2B2C31"/>

        <text x="520" y="95" fill="#BCBCBE" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="middle">contradiction · canonical conflict</text>

</html>
