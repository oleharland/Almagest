<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asking the brain from a chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F4F4F5;
      --color-ink:     #1A1C21;
      --color-muted:   #3E4044;
      --color-accent:  #3B5DEF;
      --font-sans:     'Geist Variable', 'Geist', system-ui, sans-serif;
      --font-mono:     'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.5rem; }

    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Almagest</p>
    <h1>Asking the brain from a chat</h1>
    <p class="sub">what you get back, and what happens when it has no answer</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ask-the-brain-title ask-the-brain-desc">
        <title id="ask-the-brain-title">Asking the brain from a chat</title>
        <desc id="ask-the-brain-desc">A question asked from a chat reaches the Almagest MCP server. If a page covers it, the chat writes a cited answer; if not, it says so, the miss is recorded as a gap, curators see it, and a source submitted from the chat is reviewed and merged so the next ask is answered.</desc>
        <defs>
        <marker id="ask-the-brain-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6F7074"/></marker>
        <marker id="ask-the-brain-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3B5DEF"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#F4F4F5"/>
        <rect x="44" y="40" width="956" height="264" rx="6" fill="none" stroke="#D4D4D6" stroke-width="1" stroke-dasharray="2,3"/>
        <text x="64" y="60" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">WHAT YOU SEE IN THE CHAT</text>
        <rect x="44" y="336" width="956" height="268" rx="6" fill="none" stroke="#D4D4D6" stroke-width="1" stroke-dasharray="2,3"/>
        <text x="64" y="356" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">WHAT HAPPENS BEHIND IT</text>
        <path d="M 264,108 H 292" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#ask-the-brain-arrow)"/>
        <path d="M 504,108 H 532" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#ask-the-brain-arrow)"/>
        <path d="M 676,108 H 724" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#ask-the-brain-arrow)"/>
        <rect x="686" y="88" width="28" height="12" rx="2" fill="#F4F4F5"/>
        <text x="700" y="97" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <path d="M 604,160 V 208" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#ask-the-brain-arrow)"/>
        <rect x="620" y="178" width="24" height="12" rx="2" fill="#F4F4F5"/>
        <text x="632" y="187" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <path d="M 604,280 V 372" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#ask-the-brain-arrow)"/>
        <path d="M 708,408 H 752" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#ask-the-brain-arrow)"/>
        <path d="M 866,444 V 500" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#ask-the-brain-arrow)"/>
        <rect x="892" y="466" width="76" height="12" rx="2" fill="#F4F4F5"/>
        <text x="930" y="475" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FILL THE GAP</text>
        <path d="M 752,536 H 708" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#ask-the-brain-arrow)"/>
        <path d="M 476,536 H 346 Q 338,536 338,528 V 144" fill="none" stroke="#6F7074" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ask-the-brain-arrow)"/>
        <rect x="346" y="420" width="56" height="12" rx="2" fill="#F4F4F5"/>
        <text x="374" y="429" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEXT ASK</text>
        <rect x="64" y="72" width="200" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="64" y="72" width="200" height="72" rx="6" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="80" y="96" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">YOU ASK</text>
        <text x="80" y="114" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">in Claude, Cursor or any MCP chat</text>
        <rect x="292" y="72" width="212" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="292" y="72" width="212" height="72" rx="6" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="308" y="96" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">ALMAGEST MCP</text>
        <text x="308" y="114" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">the chat calls ask</text>
        <text x="308" y="130" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">searches the reviewed wiki on main</text>
        <path d="M 604,56 L 676,108 L 604,160 L 532,108 Z" fill="#F4F4F5"/>
        <path d="M 604,56 L 676,108 L 604,160 L 532,108 Z" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="604" y="105" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Does a page</text>
        <text x="604" y="121" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">cover it?</text>
        <rect x="724" y="72" width="256" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="724" y="72" width="256" height="72" rx="6" fill="#3B5DEF" stroke="#3B5DEF" stroke-width="1"/>
        <text x="740" y="96" fill="#FFFFFF" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">CITED ANSWER</text>
        <text x="740" y="114" fill="#FFFFFF" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">the chat writes it from the pages returned</text>
        <text x="740" y="130" fill="#FFFFFF" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">each claim carries [source: id, locator]</text>
        <rect x="476" y="208" width="256" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="476" y="208" width="256" height="72" rx="6" fill="#3B5DEF" stroke="#3B5DEF" stroke-width="1"/>
        <text x="492" y="232" fill="#FFFFFF" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">NOT COVERED</text>
        <text x="492" y="250" fill="#FFFFFF" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">the chat tells you so</text>
        <text x="492" y="266" fill="#FFFFFF" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">general knowledge is not passed off as the brain's</text>
        <rect x="476" y="372" width="232" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="476" y="372" width="232" height="72" rx="6" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="492" y="396" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">GAP RECORDED</text>
        <text x="492" y="414" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">the miss is logged</text>
        <text x="492" y="430" fill="#3E4044" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">report_gap adds your context</text>
        <rect x="752" y="372" width="228" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="752" y="372" width="228" height="72" rx="6" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="768" y="396" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">GAP LIST</text>
        <text x="768" y="414" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">similar questions cluster</text>
        <text x="768" y="430" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">curators see it at /inbox/gaps</text>
        <rect x="752" y="500" width="228" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="752" y="500" width="228" height="72" rx="6" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="768" y="524" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">SUBMIT A SOURCE</text>
        <text x="768" y="542" fill="#3E4044" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start">submit_source, from the chat</text>
        <text x="768" y="558" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">contributor role or above</text>
        <rect x="476" y="500" width="232" height="72" rx="6" fill="#F4F4F5"/>
        <rect x="476" y="500" width="232" height="72" rx="6" fill="#FFFFFF" stroke="#D4D4D6" stroke-width="1"/>
        <text x="492" y="524" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">REVIEW AND MERGE</text>
        <text x="492" y="542" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">a person approves, main moves</text>
        <line x1="40" y1="632" x2="1000" y2="632" stroke="rgba(26,28,33,0.10)" stroke-width="0.8"/>
        <text x="40" y="660" fill="#55565B" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
        <path d="M 120,657 H 148" fill="none" stroke="#6F7074" stroke-width="1.2" marker-end="url(#ask-the-brain-arrow)"/>
        <text x="160" y="660" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">next step</text>
        <path d="M 248,657 H 276" fill="none" stroke="#6F7074" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ask-the-brain-arrow)"/>
        <text x="288" y="660" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">the next ask is answered and the gap closes</text>
        <rect x="580" y="651" width="28" height="12" rx="3" fill="#3B5DEF"/>
        <text x="620" y="660" fill="#55565B" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" text-anchor="start">the two outcomes of a question</text>
        </svg>
    </div>
  </div>
</body>
</html>
