<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who can reach main</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2B2C31;
      --color-ink:     #F4F4F5;
      --color-muted:   #BCBCBE;
      --color-accent:  #7B9EFF;
      --font-sans:     'Geist Variable', 'Geist', system-ui, sans-serif;
      --font-mono:     'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Almagest</p>
    <h1>Who can reach main</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trust-boundaries-dark-title trust-boundaries-dark-desc">
        <title id="trust-boundaries-dark-title">Who can reach main</title>
        <desc id="trust-boundaries-dark-desc">Trust boundaries on the way to main. The sandboxed ingest agent and chats or API tokens sit in a zone that can never approve; the agent's changes go to the service runner, and chats can only submit a source. A person with an approver role approves one exact headSha in a signed-in session, and only then does the service's own audit and merge move main. Paths from the agent to main and from chats or tokens to approval are refused at the boundary.</desc>
        <defs>
          <marker id="trust-boundaries-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#A2A3A6"/></marker>
          <marker id="trust-boundaries-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7B9EFF"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2B2C31"/>
        <rect x="24" y="24" width="232" height="312" rx="8" fill="rgba(244,244,245,0.02)" stroke="rgba(244,244,245,0.16)" stroke-width="0.8"/>
        <text x="40" y="41" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">AGENTS · CAN NEVER APPROVE</text>
        <rect x="336" y="24" width="296" height="312" rx="8" fill="rgba(244,244,245,0.02)" stroke="rgba(244,244,245,0.16)" stroke-width="0.8"/>
        <text x="352" y="41" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">SERVICE · RUNS THE AUDIT AND MERGE</text>
        <rect x="688" y="24" width="248" height="144" rx="8" fill="rgba(244,244,245,0.02)" stroke="rgba(244,244,245,0.16)" stroke-width="0.8"/>
        <text x="704" y="41" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">PEOPLE · APPROVER ROLE</text>
        <line x1="240" y1="88" x2="352" y2="88" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#trust-boundaries-dark-arrow)"/>
        <rect x="273.0" y="68" width="46" height="12" rx="2" fill="#2B2C31"/>
        <text x="296" y="77" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHANGES</text>
        <path d="M240,256 H288 Q296,256 296,248 V180 Q296,172 304,172 H352" fill="none" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#trust-boundaries-dark-arrow)"/>
        <rect x="306.0" y="206" width="40" height="12" rx="2" fill="#2B2C31"/>
        <text x="326" y="215" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT</text>
        <line x1="616" y1="96" x2="704" y2="96" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#trust-boundaries-dark-arrow)"/>
        <rect x="634.0" y="76" width="52" height="12" rx="2" fill="#2B2C31"/>
        <text x="660" y="85" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PROPOSAL</text>
        <line x1="240" y1="152" x2="328" y2="152" stroke="#A2A3A6" stroke-width="1" stroke-dasharray="5,4"/>
        <line x1="328" y1="145" x2="328" y2="159" stroke="#F4F4F5" stroke-width="2"/>
        <rect x="246.0" y="132" width="76" height="12" rx="2" fill="#2B2C31"/>
        <text x="284" y="141" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CANNOT MERGE</text>
        <line x1="240" y1="296" x2="328" y2="296" stroke="#A2A3A6" stroke-width="1" stroke-dasharray="5,4"/>
        <line x1="328" y1="289" x2="328" y2="303" stroke="#F4F4F5" stroke-width="2"/>
        <rect x="242.0" y="276" width="84" height="12" rx="2" fill="#2B2C31"/>
        <text x="284" y="285" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CANNOT APPROVE</text>
        <path d="M736,152 V268 Q736,276 728,276 H616" fill="none" stroke="#7B9EFF" stroke-width="1.6" marker-end="url(#trust-boundaries-dark-arrow-accent)"/>
        <rect x="646.0" y="256" width="52" height="12" rx="2" fill="#2B2C31"/>
        <text x="672" y="265" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APPROVES</text>
        <line x1="484" y1="320" x2="484" y2="376" stroke="#7B9EFF" stroke-width="1.6" marker-end="url(#trust-boundaries-dark-arrow-accent)"/>
        <rect x="500.0" y="342" width="40" height="12" rx="2" fill="#2B2C31"/>
        <text x="520" y="351" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MERGE</text>
        <rect x="40" y="56" width="200" height="128" rx="6" fill="#2B2C31"/>
        <rect x="40" y="56" width="200" height="128" rx="6" fill="#2B2C31" stroke="#F4F4F5" stroke-width="1.2" stroke-dasharray="4,3"/>
        <rect x="56" y="68" width="72" height="12" rx="2" fill="none" stroke="#88898C" stroke-width="0.8"/>
        <text x="92.0" y="77" fill="#A2A3A6" font-size="7" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SANDBOXED</text>
        <text x="56" y="108" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" font-weight="600">Ingest agent</text>
        <text x="56" y="124" fill="#A2A3A6" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" letter-spacing="0">own worktree · ingest/…</text>
        <text x="56" y="138" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">writes confined to brain/</text>
        <text x="56" y="152" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">no git, network or MCP tools</text>
        <text x="56" y="166" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">secrets stripped from environment</text>
        <rect x="40" y="232" width="200" height="88" rx="6" fill="#2B2C31"/>
        <rect x="40" y="232" width="200" height="88" rx="6" fill="#2B2C31" stroke="#88898C" stroke-width="1"/>
        <text x="56" y="260" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" font-weight="600">Chats and API tokens</text>
        <text x="56" y="276" fill="#A2A3A6" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" letter-spacing="0">MCP · bearer /api</text>
        <text x="56" y="290" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">read the brain, submit a source</text>
        <text x="56" y="304" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">can never approve</text>
        <rect x="352" y="56" width="264" height="128" rx="6" fill="#2B2C31"/>
        <rect x="352" y="56" width="264" height="128" rx="6" fill="#2B2C31" stroke="#88898C" stroke-width="1"/>
        <text x="368" y="84" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" font-weight="600">Runner</text>
        <text x="368" y="100" fill="#A2A3A6" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" letter-spacing="0">ingest/runner.mjs</text>
        <text x="368" y="114" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">starts the agent, commits to its branch</text>
        <text x="368" y="128" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">main untouched</text>
        <text x="368" y="142" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">never trusts the worktree's .git file</text>
        <rect x="704" y="56" width="216" height="96" rx="6" fill="#2B2C31"/>
        <rect x="704" y="56" width="216" height="96" rx="6" fill="#2B2C31" stroke="#88898C" stroke-width="1"/>
        <text x="720" y="84" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" font-weight="600">Approvers</text>
        <text x="720" y="100" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">reviewer, owner or admin</text>
        <text x="720" y="114" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">signed-in browser session + CSRF</text>
        <text x="720" y="128" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">approves the exact headSha shown</text>
        <rect x="352" y="232" width="264" height="88" rx="6" fill="#2B2C31"/>
        <rect x="352" y="232" width="264" height="88" rx="6" fill="#2B2C31" stroke="#88898C" stroke-width="1"/>
        <text x="368" y="260" fill="#F4F4F5" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" font-weight="600">Audit and merge</text>
        <text x="368" y="276" fill="#A2A3A6" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" letter-spacing="0">verifyCandidate</text>
        <text x="368" y="290" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">path check, then the service's own audit</text>
        <text x="368" y="304" fill="#A2A3A6" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">exit 1 blocks the merge</text>
        <rect x="352" y="376" width="264" height="88" rx="6" fill="#2B2C31"/>
        <rect x="352" y="376" width="264" height="88" rx="6" fill="#7B9EFF" stroke="#7B9EFF" stroke-width="1"/>
        <rect x="368" y="388" width="84" height="12" rx="2" fill="none" stroke="rgba(26,28,33,0.55)" stroke-width="0.8"/>
        <text x="410.0" y="397" fill="#1A1C21" font-size="7" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APPROVED ONLY</text>
        <text x="368" y="422" fill="#1A1C21" font-size="12" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" font-weight="600">main</text>
        <text x="368" y="438" fill="#1A1C21" font-size="9" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" letter-spacing="0">brain/wiki/</text>
        <text x="368" y="452" fill="#1A1C21" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">only an approved, audited merge</text>
        <text x="40" y="408" fill="#BCBCBE" font-size="14" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" font-style="italic">An unrestricted shell can always reach</text>
        <text x="40" y="426" fill="#BCBCBE" font-size="14" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" font-style="italic">.git and the service's secrets. Only</text>
        <text x="40" y="444" fill="#BCBCBE" font-size="14" font-family="'Geist Variable', 'Geist', system-ui, sans-serif" font-style="italic">OS-level separation closes that.</text>
        <line x1="24" y1="488" x2="936" y2="488" stroke="rgba(244,244,245,0.13)" stroke-width="0.8"/>
        <text x="24" y="515" fill="#A2A3A6" font-size="8" font-family="'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="96" y="506" width="20" height="12" rx="3" fill="#7B9EFF"/>
        <text x="124" y="515" fill="#BCBCBE" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">main</text>
        <rect x="168" y="506" width="20" height="12" rx="3" fill="#2B2C31" stroke="#88898C" stroke-width="1"/>
        <text x="196" y="515" fill="#BCBCBE" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">Actor or step</text>
        <rect x="284" y="506" width="20" height="12" rx="3" fill="#2B2C31" stroke="#F4F4F5" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="312" y="515" fill="#BCBCBE" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">Sandboxed agent</text>
        <line x1="420" y1="512" x2="451" y2="512" stroke="#A2A3A6" stroke-width="1.2" marker-end="url(#trust-boundaries-dark-arrow)"/>
        <text x="460" y="515" fill="#BCBCBE" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">Allowed</text>
        <line x1="522" y1="512" x2="553" y2="512" stroke="#7B9EFF" stroke-width="1.6" marker-end="url(#trust-boundaries-dark-arrow-accent)"/>
        <text x="562" y="515" fill="#BCBCBE" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">The approved path into main</text>
        <line x1="716" y1="512" x2="744" y2="512" stroke="#A2A3A6" stroke-width="1" stroke-dasharray="5,4"/>
        <line x1="744" y1="506" x2="744" y2="518" stroke="#F4F4F5" stroke-width="2"/>
        <text x="756" y="515" fill="#BCBCBE" font-size="9" font-family="'Geist Variable', 'Geist', system-ui, sans-serif">Refused: stops at the boundary</text>
      </svg>
    </div>
  </div>
</body>
</html>
