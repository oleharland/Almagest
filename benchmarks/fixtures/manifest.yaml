# benchmarks/fixtures/manifest.yaml
# ──────────────────────────────────────────────────────────────────────────────
# The machine record for the BENCHMARK FIXTURE corpus. Not `brain/manifest.yaml`
# and never read by it — this file exists so the fixture is a complete Almagest
# brain rather than a wiki with two of its three records missing.
#
# It is what lets `tools/audit.mjs` verify the fixture at all: PROV-003 asks
# whether every cited source is a manifest entry, and CITE-005 asks whether the
# digest each page carries still matches the one recorded here. Without this file
# the gold wiki could only ever be audited with those two checks disabled, which
# is the same as saying its provenance is unchecked.
#
# Every source here is a committed text file, so there are no sidecars: `sha256`
# is the digest of `path` itself, and that is the value every page repeats in
# `sources[].sha256`.
#
# NOT copied into any arena. The arena holds what a reader is given — sources,
# the wiki, and the catalog. The manifest is an ingest artifact, and handing it
# to the answering agent would turn the drift arm's question from "did you notice
# the page disagrees with the document" into "did you compare two hex strings".
# See fixtures/README.md.
#
# Regenerate the digests after any edit to raw/:
#     shasum -a 256 benchmarks/fixtures/raw/*.md
# selftest.sh checks them, so a stale digest here fails the selftest rather than
# quietly turning CITE-005 into noise.
# ──────────────────────────────────────────────────────────────────────────────

