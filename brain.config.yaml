# brain.config.yaml
# ──────────────────────────────────────────────────────────────────────────────
# Instance configuration for an Almagest knowledge base.
# This is the single place where instance-specific values live.
# Agent rules files reference this config instead of hardcoding values.
# ──────────────────────────────────────────────────────────────────────────────


# ── Identity ──────────────────────────────────────────────────────────────────

# Human-readable name for this knowledge base instance.
name: "My Knowledge Base"


# ── Directory layout ──────────────────────────────────────────────────────────

# Root directory of the knowledge base content (relative to repo root).
brain_dir: brain


# ── Agent runtime ─────────────────────────────────────────────────────────────
# Almagest is harness-agnostic: it runs on any coding agent that meets the
# contract in `agent/contract.md`. Nothing here names a vendor in the rules —
# the rules speak in capability tiers, and this block maps those tiers onto
# whatever models your harness actually has.

agent:

  # Which harness this instance runs on. Selects the profile below, and tells
  # the agent which rule-loading mode applies (see docs/agent-harnesses.md).
  # Known values: claude-code | codex | cursor | gemini-cli | copilot |
  #               antigravity | generic
  harness: claude-code

  # Capability tiers. Rules files reference ONLY these two names, never a model.
  #
  #   mechanical — parsing, hashing, slug and string comparison, structural
  #                checks, straightforward extraction. A cheaper model is enough.
  #   judgment   — weighing which source is stronger, classifying a diff as
  #                addition / revision / removal, deciding whether two pages
  #                describe the same entity, reconciling drift, cross-source
  #                synthesis. Anything producing a recommendation you will act on.
  #
  # Advisory, not dispatch: most harnesses cannot switch model mid-task. If
  # yours cannot, run the whole session on the model sized for the heaviest
  # tier that session will hit — which for any ingest means `judgment`.
  profiles:
    claude-code:
      mechanical: sonnet
      judgment: opus
    codex:
      mechanical: gpt-5-mini
      judgment: gpt-5
    cursor:
      mechanical: gpt-5-mini
      judgment: gpt-5
    gemini-cli:
      mechanical: gemini-2.5-flash
      judgment: gemini-2.5-pro
    antigravity:
      # Antigravity (`agy`) is not the Gemini CLI and does not spell its models
      # the way the Gemini API does: the reasoning-effort suffix is part of the
      # model name. Verified against `agy models` on 2026-08-26. The account also
      # offered gemini-3.{5,6}-flash-*, gemini-3.1-pro-low, claude-sonnet-4-6,
      # claude-opus-4-6-thinking and gpt-oss-120b-medium — run `agy models`
      # yourself, since the list is per-account and changes.
      mechanical: gemini-3.7-flash-low
      judgment: gemini-3.1-pro-high
    copilot:
      mechanical: gpt-5-mini
      judgment: gpt-5
    generic:
      mechanical: "<your fast model>"
      judgment: "<your strongest model>"


# ── Ingest manifest ───────────────────────────────────────────────────────────
# The manifest is the machine-readable record of every ingested source. It is
# what makes re-ingest incremental: the agent fingerprints each source (sha256
# for local files, commit SHA for remote ones) and compares against this file to
# decide whether it is new, unchanged, or changed. See docs/manifest.md.
#
# It supplements brain/index.md — it does not replace it. index.md is the
# human-readable catalog; the manifest is the machine record. Keep both.
#
# There is deliberately no on/off switch and no choice of algorithm. Filename or
# mtime matching is the bug the manifest exists to fix, so it is not offered as
# an option, and sha256 needs no configuration.

manifest:

  # Where the manifest lives, relative to repo root. The only reason to change
  # this is a multi-brain setup, where each brain carries its own manifest
  # alongside its own index.md (see docs/multi-brain.md).
  path: brain/manifest.yaml


# ── Wiki page types ───────────────────────────────────────────────────────────
# The set of valid `type` values for wiki page frontmatter.
# Each value maps to a distinct editorial purpose.
#
#   topic      — a broad subject area or domain cluster
#   concept    — a defined term or abstract idea worth explaining
#   decision   — a recorded architectural or strategic decision (ADR-style)
#   reference  — stable lookup material (standards, specs, glossaries)
#   entity     — a real-world thing: a product, org, person-role, or system
#   claim      — YOUR conclusion, not a source's. Normally `origin: self`, so its
#                body carries no inline citations; instead it must name what it
#                rests on in a `## Basis` section of [[wikilinks]] to
#                `origin: source` pages. Title it as a sentence, not a noun —
#                "Availability warranties transfer O&M risk to the vendor",
#                not "Warranties".

page_types:
  - topic
  - concept
  - decision
  - reference
  - entity
  - claim


# ── Type-specific requirements ───────────────────────────────────────────────
# Additional frontmatter fields required (or recommended) for each page type.
# The agent will prompt for these when creating a page of that type.
# All other page types inherit only the base fields.
#
# An entry prefixed `section:` names a required BODY section rather than a
# frontmatter field. Everything else is a frontmatter key.
# Missing entries are audit check SCHEMA-003.

type_fields:
  decision:
    - decision_date      # ISO-8601 date the decision was made
    - decision_status    # proposed | accepted | superseded | deprecated
    - options            # list of alternatives that were considered

  entity:
    - entity_type        # product | organisation | system | role
                         # `aliases` is a base field now — do not re-declare it

  claim:
    - "section:## Basis" # REQUIRED. Bullets are [[wikilinks]] to `origin: source`
                         # pages. A claim page needs no inline citations, so this
                         # section is the only thing tying it to evidence — an
                         # empty or prose Basis is check CITE-006.


# ── Anonymization ─────────────────────────────────────────────────────────────
# Controls how the ingest agent handles personal and organisational names
# found in source documents before they are written into the wiki.

anonymization:

  # Master switch. When false (the default), the agent writes personal names
  # through to the wiki untouched — the right behaviour for a personal or
  # public knowledge base where names are part of the content.
  #
  # Turn this ON when any of the following is true:
  #   - the wiki is shared beyond the people named in it
  #   - sources are real meeting notes, transcripts, tickets, or CRM exports
  #   - you are handling personal data under GDPR or a similar regime
  #
  # When enabled, the agent runs a named-entity pass over every source before
  # extraction, STOPS on each personal name it finds, and waits for approval
  # before writing a role-based replacement.
  #
  # This is BEST-EFFORT and is stated as such deliberately. An agent NER pass
  # misses names; the mandatory human review of the resulting diff is the
  # actual control, not the pass. Do not treat `enabled: true` as compliance.
  enabled: false

  # NOTE — `role_patterns` was REMOVED, not renamed.
  #
  # It held three regexes of the shape `Firstname Lastname, Engineering Lead`.
  # That form matches a rounding error of the names in real sources: it misses
  # every name without an appended job title, every name in a possessive or
  # inflected form, every non-Western name shape, every initial, every name in
  # a filename, and every name that appears alone in a sentence. What it did
  # produce was a config block that looked like coverage — and that confidence
  # is precisely what stops a reviewer reading the diff, in the GDPR case this
  # setting exists for. A regex list that is 5% effective and 100% reassuring
  # is worse than no regex list.
  #
  # The replacement is the NER pass above plus mandatory human diff review.

  # Names that should NOT be flagged as personal data.
  # Add company names, product names, and well-known terms here.
  # This list still does real work: it suppresses the NER pass's false
  # positives, which is a job a fixed list is actually good at.
  ignore_names:
    - "Acme Corp"
    - "Almagest"


# ── Canonical pages ───────────────────────────────────────────────────────────
# Wiki page slugs that are treated as locked reference lists.
# The agent will refuse to delete or rename these pages and will warn
# before making structural edits to their content.

canonical_pages:
  - taxonomy      # master list of approved tags and categories
  - glossary      # authoritative term definitions


# ── Ownership ─────────────────────────────────────────────────────────────────
# The `owner` frontmatter field names the team responsible for keeping a page
# accurate. Useful in an organisation, pure friction for a solo knowledge base.

# When true, every wiki page must carry an `owner` from `owner_teams`, and the
# audit reports a schema violation for any page missing one.
# When false (the default), `owner` is optional and unvalidated.
require_owner: false

# Valid values for the `owner` frontmatter field.
# Only enforced when `require_owner: true`. Replace with your own teams.
owner_teams:
  - engineering
  - product
  - leadership
  - design
  - operations


# ── Audit ─────────────────────────────────────────────────────────────────────
# Configuration read by `tools/audit.mjs`. The audit is a deterministic Node
# program, not an agent reading pages one by one — that is why its thresholds
# and severities live in config instead of in prose in a rules file.
#
# The agent RUNS the tool. It does not re-implement the checks by hand, and it
# does not argue with the exit code. See docs/audit.md.

audit:

  # `last_verified` older than this many days makes the page stale (STALE-001).
  # Keyed by tier, plus a tighter threshold for anything still `status: stub` —
  # a stub is a promise to come back, and 30 days is when the promise expires.
  stale_after_days:
    canonical: 0         # 0 = never stale. Canonical pages change by human edit only
    curated: 90
    evidence: 90
    stub: 30             # applies by status, and wins over the tier threshold

  # Which check IDs fail the run. Errors exit 1 and block an ingest commit;
  # warnings are reported and exit 0. Nothing here is a matter of taste: an
  # error means the wiki asserts something it cannot back up.
  severity:
    errors:
      - SCHEMA-001       # missing required frontmatter field
      - SCHEMA-002       # invalid enum value (type/tier/status/confidence/origin)
      - SCHEMA-003       # missing type_fields entry required for this type
      - SCHEMA-004       # owner missing or not in owner_teams while require_owner
      - SCHEMA-005       # type carries a type_fields vocabulary value
      - LINK-001         # [[wikilink]] to a page that does not exist
      - LINK-003         # relations target does not exist
      - CITE-001         # citation does not parse against the frozen grammar
      - CITE-002         # citation id not in that page's sources
      - CITE-003         # unsourced claim on an origin: source page
      - CITE-004         # origin: source page with empty sources
      - CITE-005         # sources[].sha256 disagrees with manifest.yaml
      - CITE-006         # origin: self page with no/invalid ## Basis
      - PROV-001         # sources[].path does not exist on disk
      - PROV-002         # manifest entry names a pages slug that does not exist
      - PROV-003         # a page's source is absent from manifest.yaml
      - PROV-004         # index.md names a page that does not exist
    warnings:
      - LINK-002         # orphan — zero backlinks
      - PROV-005         # page exists with no index.md row
      - CANON-001        # outstanding entries in canonical-challenges.md
      - STALE-001        # last_verified past threshold

  # PROV-004 and PROV-005 are the two directions of the same drift and are
  # deliberately NOT the same severity. An index.md row naming a page that does
  # not exist asserts something false — error. A page with no row is an omission
  # that asserts nothing — warning. Failing a build over the second punishes
  # bookkeeping rather than truth.

  # Append-only ledger of evidence that contradicts a canonical page. Lives
  # OUTSIDE brain/wiki/ on purpose, so the wiki write gate does not apply to it
  # and the agent can record a challenge without proposing a wiki edit.
  challenges_path: brain/canonical-challenges.md

  # Derived index emitted by `tools/audit.mjs index`. Committed, not gitignored —
  # same idiom as the generated harness shims, and verified by `--check-index`.
  index_dir: brain/.index


# ── Sources ───────────────────────────────────────────────────────────────────
# Defines where the ingest agent pulls raw material from.

sources:

  # Local drop folder — files placed here are picked up by the ingest agent.
  # Path is relative to repo root.
  local:
    path: brain/raw

  # Remote repositories pulled via MCP. See docs/remote-sources.md for setup.
  #
  # Fields per entry:
  #   provider — github | gitlab — which MCP server reads this repo
  #   repo     — project path (owner/repo on GitHub, namespace/project on GitLab)
  #   paths    — glob array of paths within that repo to ingest
  #   branch   — branch to read from (defaults to default branch if omitted)
  #   label    — tag applied to wiki pages derived from this source
  #
  # Example entries (commented out — uncomment and fill in real values):
  remote:
    # - provider: github
    #   repo: acme/platform-docs
    #   paths:
    #     - "docs/**/*.md"
    #     - "adr/**/*.md"
    #   branch: main
    #   label: platform

    # - provider: gitlab
    #   repo: acme/design-system
    #   paths:
    #     - "**/*.md"
    #   branch: main
    #   label: design-system
